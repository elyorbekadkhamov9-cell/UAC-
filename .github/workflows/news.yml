name: Telegram yangiliklari
# Kanal postlarini (t.me/s/ChemistryUAC) saytdagi news-uac.js fayliga yozadi. Rasm fayllari assets/news/ ichida saqlanadi.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the feed
        run: python3 tools/tg_feed.py
      - name: Commit when something changed
        run: |
          git config user.name "uac-news-bot"
          git config user.email "uac-news-bot@users.noreply.github.com"
          git add news-uac.js assets/news
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Yangiliklar: kanal postlari yangilandi"
            git push
          fi
