<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahifa topilmadi — UAC</title>
<link rel="icon" type="image/png" href="/UAC-/new/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Instrument+Serif:ital@1&family=Geologica:wght@300..700&display=swap">
<link rel="stylesheet" href="/UAC-/new/site.css">
<style>
.lost{min-height:100dvh;display:grid;align-items:center;padding-block:48px}
.lost .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:32px 64px;align-items:center}
.code{font-family:var(--f-display);font-weight:700;font-size:clamp(96px,18vw,220px);line-height:.85;letter-spacing:-.05em;color:var(--navy);display:flex;align-items:baseline;gap:.04em}
.code em{font-family:var(--f-serif);font-weight:400;color:var(--sky-ink);letter-spacing:0}
.lost h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.1;letter-spacing:-.03em;color:var(--ink);margin-top:28px}
.lost p{color:var(--muted);max-width:30em;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.mascot{width:min(300px,60vw);justify-self:center;filter:drop-shadow(0 24px 28px rgba(22,103,158,.2));transform:rotate(-6deg)}
@media (max-width:820px){ .lost .wrap{grid-template-columns:minmax(0,1fr)} .mascot{grid-row:1;width:min(200px,50vw)} }
</style>
</head>
<body>
<main class="lost" id="main">
  <div class="wrap">
    <div>
      <p class="mono eyebrow">UAC</p>
      <div class="code" aria-hidden="true">4<em>0</em>4</div>
      <h1>Bu sahifa topilmadi</h1>
      <p>Havola eskirgan yoki manzilda xato bo‘lishi mumkin. Masalalar va kitoblar joyida, quyidan oching.</p>
      <div class="row">
        <a class="btn btn-primary" href="/UAC-/">Bosh sahifaga
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="btn btn-ghost" href="/UAC-/new/masalalar.html">Masalalar arxivi</a>
      </div>
    </div>
    <img class="mascot" src="/UAC-/new/assets/mascot.png" alt="" width="414" height="560">
  </div>
</main>
</body>
</html>
