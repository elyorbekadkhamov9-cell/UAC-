<style>
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.filters button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 15px/1 var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s}
.filters button:hover{border-color:var(--navy)}
.filters button i{width:12px;height:12px;border-radius:3px;display:inline-block}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.shelves{padding-block:20px 110px;display:flex;flex-direction:column;gap:56px}
.shelf-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:6px}
.shelf-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,2.6vw,34px);letter-spacing:-.03em;color:var(--navy)}
.shelf-head span{font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--muted)}
.shelf-scroll{overflow-x:auto;padding-top:26px;padding-bottom:30px;scrollbar-width:thin}
.shelf-row{display:flex;gap:26px;align-items:flex-end;width:max-content;min-width:100%;padding:0 26px;position:relative}
.shelf-row::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;background:var(--navy);border-radius:4px;box-shadow:0 14px 22px -10px rgba(12,31,53,.45)}
.book{perspective:900px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.cover{position:relative;width:156px;height:220px;border-radius:4px 8px 8px 4px;padding:14px 14px 12px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 1px 2px rgba(12,31,53,.15),0 12px 20px -10px rgba(12,31,53,.45);transform-origin:left center;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.05) 70%,rgba(255,255,255,.18))}
.cover img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-14px) rotateY(-16deg) rotateX(3deg);box-shadow:0 1px 2px rgba(12,31,53,.15),22px 26px 34px -14px rgba(12,31,53,.5)}
.cv-top{display:flex;justify-content:space-between;align-items:center;gap:6px;position:relative}
.cv-lang{font:600 11px/1 var(--f-body);letter-spacing:.08em;padding:4px 7px;border-radius:5px;background:rgba(255,255,255,.94);color:var(--ink)}
.cv-part{font:500 12px/1 var(--f-body);opacity:.92}
.cv-title{font-family:var(--f-body);font-weight:650;font-size:16px;line-height:1.15;position:relative;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cv-author{font-family:var(--f-serif);font-style:italic;font-size:21px;line-height:1.05;position:relative;margin-top:6px}
.cv-foot{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.cv-cat{font:600 10px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.cv-foot svg{width:30px;height:30px}
/* detail sheet */
.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;clear:both;padding-top:6px}
.detail .cover{width:200px;height:282px;transform:none!important}
.detail .cover .cv-title{font-size:20px}
.detail .cover .cv-author{font-size:26px}
.detail h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3vw,34px);letter-spacing:-.025em;line-height:1.1;margin-top:8px;color:var(--navy)}
.detail .by{font-family:var(--f-serif);font-style:italic;font-size:26px;color:var(--sky-ink);margin-top:6px}
.detail .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.detail .facts span{font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--band);color:var(--navy)}
.detail .about{color:var(--muted);margin-top:16px;max-width:32em}
.detail .btn{margin-top:22px}
@media (max-width:620px){ .detail{grid-template-columns:minmax(0,1fr)} .detail .cover{width:160px;height:226px} }

<script>
(function(){
  var D="https://drive.google.com/uc?export=download&id=";
  var CATS=[
    {k:"inorg",name:"Noorganik kimyo",bg:"#1B3A5C",fg:"#FFFFFF",motif:'<circle cx="8" cy="8" r="3"/><circle cx="22" cy="8" r="3"/><circle cx="8" cy="22" r="3"/><circle cx="22" cy="22" r="3"/><circle cx="15" cy="15" r="4"/>'},
    {k:"org",name:"Organik kimyo",bg:"#3E9BD8",fg:"#0C1F35",motif:'<path d="M15 3l10 6v12l-10 6-10-6V9z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="15" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>'},
    {k:"anal",name:"Analitik kimyo",bg:"#FFC94D",fg:"#0C1F35",motif:'<path d="M11 3h8M13 3v9l-7 13h18l-7-13V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 20h12" stroke="currentColor" stroke-width="2"/>'},
    {k:"phys",name:"Fizikaviy kimyo",bg:"#2F77AE",fg:"#FFFFFF",motif:'<path d="M2 15c3-8 6-8 9 0s6 8 9 0 6-8 8-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'},
    {k:"bio",name:"Biokimyo",bg:"#CFE6F6",fg:"#1B3A5C",motif:'<path d="M8 2c0 8 14 8 14 13S8 20 8 28M22 2c0 8-14 8-14 13s14 5 14 13" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 8h10M10 22h10" stroke="currentColor" stroke-width="1.5"/>'}
  ];
  /* img: put a cover photo path here (for example "assets/covers/clayden-1.jpg") to show a real cover instead of the designed one */
  var BOOKS=[
    {c:"inorg",t:"Inorganic Chemistry",a:"Housecroft",l:"EN",d:"Noorganik kimyo bo‘yicha klassik darslik: nazariya, elementlar kimyosi, spektroskopiya.",id:"1g-1ZaP38b6HKfOUU3pkFAjGaaj-DHQ4V",img:null},
    {c:"inorg",t:"Неорганическая химия",a:"Третьяков",l:"RU",d:"Rus tilidagi noorganik kimyo darsligi, universitetlar uchun asosiy adabiyot.",id:"1PSZlVRvEvXEyxmT5tJaH06EXemU85qb6",img:null},
    {c:"org",t:"Organic Chemistry",a:"Clayden",p:"1-qism",l:"EN",d:"Organik kimyo bo‘yicha eng mashhur darslik: reaksiya mexanizmlari, stereokimyo, sintez.",id:"14Nje3WlZ07K1YUNmTSBB97YIXei6_IFx",img:null},
    {c:"org",t:"Organic Chemistry",a:"Clayden",p:"2-qism",l:"EN",d:"Organik kimyo bo‘yicha eng mashhur darslik: reaksiya mexanizmlari, stereokimyo, sintez.",id:"1aMHSlMkbdB5niUCNCK6iS9vtdZhXhoVx",img:null},
    {c:"org",t:"Organic Chemistry",a:"Clayden",p:"3-qism",l:"EN",d:"Organik kimyo bo‘yicha eng mashhur darslik: reaksiya mexanizmlari, stereokimyo, sintez.",id:"14J2lCk735tg8y2bp1P7aWgMKniiMN8nv",img:null},
    {c:"org",t:"Органическая химия для олимпиадников",a:"Сальников",l:"RU",d:"Olimpiadaga tayyorgarlik uchun maxsus kitob: murakkab masalalar va reaksiyalar.",id:"1E97zcIZA8lU_xSzVyoaHh713L_WhaikR",img:null},
    {c:"anal",t:"Основы аналитической химии",a:"Золотов",p:"1-qism",l:"RU",d:"Analitik kimyo bo‘yicha klassik darslik: nazariy asoslar, metodlar.",id:"1Q46DM_3glZ5zOdLKAtuFV2qYhDANVJGb",img:null},
    {c:"anal",t:"Основы аналитической химии",a:"Золотов",p:"2-qism",l:"RU",d:"Analitik kimyo bo‘yicha klassik darslik: amaliy masalalar, usullar.",id:"1K_4seI_u1P-fWW3ZgxGDvQfhbPLWRlu4",img:null},
    {c:"anal",t:"Качественный анализ",a:"Алексеев",l:"RU",d:"Sifat tahlili bo‘yicha klassik qo‘llanma: kationlar va anionlarni aniqlash.",id:"1K_4seI_u1P-fWW3ZgxGDvQfhbPLWRlu4",img:null},
    {c:"anal",t:"Количественный анализ",a:"Алексеев",l:"RU",d:"Miqdoriy tahlil bo‘yicha qo‘llanma: titrimetriya, gravimetriya.",id:"1DM2l1kzvLtjGYpCwAB8JG4wiOp4Dq6Bw",img:null},
    {c:"phys",t:"Physical Chemistry",a:"Atkins",l:"EN",d:"Fizikaviy kimyo bo‘yicha dunyodagi eng mashhur darslik: termodinamika, kinetika, kvant kimyosi.",id:"1DApiEZ2y97tOyv_7cEI5UDTEXgMSoxxN",img:null},
    {c:"phys",t:"Математическая и теоретическая химия",a:"",l:"RU",d:"Kimyoda qo‘llaniladigan matematik usullar va nazariy asoslar.",id:"1tITtnTTnWmiwAR_S1KIh8IN0sFzhf1l4",img:null},
    {c:"bio",t:"Biochemistry",a:"Lehninger",p:"1-qism",l:"EN",d:"Biokimyo bo‘yicha klassik darslik: oqsillar, fermentlar, membranalar.",id:"1uoDw8Cs4AkDYUwWiHwZjwGlKGkn8sN23",img:null},
    {c:"bio",t:"Biochemistry",a:"Lehninger",p:"2-qism",l:"EN",d:"Biokimyo bo‘yicha klassik darslik: uglevodlar, lipidlar, nuklein kislotalar.",id:"1bJejNYJyaiLBJAXKlF58Sg6iUW0E0MYx",img:null},
    {c:"bio",t:"Biochemistry",a:"Lehninger",p:"3-qism",l:"EN",d:"Biokimyo bo‘yicha klassik darslik: metabolizm, energiya almashinuvi.",id:"18VSpVU1ewGbQJIhT6tTeG2ursGNNu8Zd",img:null},
    {c:"bio",t:"Наглядная биохимия",a:"Кольман",l:"RU",d:"Biokimyo bo‘yicha rasmli, tushunarli qo‘llanma.",id:"1V2IoJy7OAEgT70xkoN223PxklXkM3Xb1",img:null}
  ];
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function cat(k){ return CATS.filter(function(c){ return c.k===k; })[0]; }
  function coverHtml(b){
    var c=cat(b.c);
    if(b.img) return '<div class="cover" style="background:'+c.bg+'"><img class="photo" src="'+esc(b.img)+'" alt=""></div>';
    return '<div class="cover" style="background:'+c.bg+';color:'+c.fg+'">'+
      '<div class="cv-top"><span class="cv-lang">'+b.l+'</span><span class="cv-part">'+(b.p||"")+'</span></div>'+
      '<div><div class="cv-title">'+esc(b.t)+'</div>'+(b.a?'<div class="cv-author">'+esc(b.a)+'</div>':'')+'</div>'+
      '<div class="cv-foot"><span class="cv-cat">'+c.name.replace(" kimyo","")+'</span><svg viewBox="0 0 30 30" fill="currentColor" aria-hidden="true">'+c.motif+'</svg></div></div>';
  }

  /* filters */
  var filters=document.getElementById("filters"), active="all";
  filters.innerHTML='<button type="button" aria-pressed="true" data-k="all" data-hover>Barchasi</button>'+
    CATS.map(function(c){ return '<button type="button" aria-pressed="false" data-k="'+c.k+'" data-hover><i style="background:'+c.bg+';outline:1px solid rgba(12,31,53,.2)"></i>'+c.name+'</button>'; }).join("");
  filters.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; active=b.getAttribute("data-k");
    [].forEach.call(filters.children,function(x){ x.setAttribute("aria-pressed",x===b?"true":"false"); }); UAC.Sound.init(); UAC.Sound.click(); render(); });

  /* shelves */
  var shelves=document.getElementById("shelves");
  function render(){
    shelves.innerHTML=CATS.filter(function(c){ return active==="all"||active===c.k; }).map(function(c){
      var list=BOOKS.map(function(b,i){ b.i=i; return b; }).filter(function(b){ return b.c===c.k; });
      return '<div class="shelf"><div class="shelf-head"><h2>'+c.name+'</h2><span>'+list.length+' ta kitob</span></div>'+
        '<div class="shelf-scroll"><div class="shelf-row">'+list.map(function(b){
          return '<div><button class="book" type="button" data-i="'+b.i+'" data-hover aria-label="'+esc(b.t+(b.a?", "+b.a:"")+(b.p?", "+b.p:"")+" — batafsil")+'">'+coverHtml(b)+'</button></div>';
        }).join("")+'</div></div></div>';
    }).join("");
  }
  render();

  /* detail sheet */
  var modal=document.getElementById("modal"), detail=document.getElementById("detail"), lastFocus=null;
  shelves.addEventListener("click",function(e){
    var b=e.target.closest(".book"); if(!b) return; var bk=BOOKS[+b.getAttribute("data-i")], c=cat(bk.c);
    UAC.Sound.init(); UAC.Sound.page();
    detail.innerHTML=coverHtml(bk)+'<div><p class="mono eyebrow">'+c.name+'</p><h2 id="bookTitle">'+esc(bk.t)+'</h2>'+(bk.a?'<p class="by">'+esc(bk.a)+'</p>':'')+
      '<div class="facts"><span>'+(bk.l==="EN"?"Inglizcha":"Ruscha")+'</span>'+(bk.p?'<span>'+bk.p+'</span>':'')+'<span>PDF</span></div>'+
      '<p class="about">'+esc(bk.d)+'</p>'+
      '<a class="btn btn-primary" href="'+D+bk.id+'" target="_blank" rel="noopener" data-sfx="click">Yuklab olish <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></a></div>';
    lastFocus=b; modal.hidden=false; requestAnimationFrame(function(){ modal.classList.add("open"); }); document.getElementById("sheetClose").focus();
  });
  function closeModal(){ modal.classList.remove("open"); setTimeout(function(){ modal.hidden=true; },250); if(lastFocus) lastFocus.focus(); }
  document.getElementById("sheetClose").addEventListener("click",closeModal);
  modal.addEventListener("click",function(e){ if(e.target===modal) closeModal(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!modal.hidden) closeModal(); });
})();
</script>
